<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="pwaGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6" />
      <stop offset="25%" stop-color="#E5C07B" />
      <stop offset="55%" stop-color="#C5A059" />
      <stop offset="85%" stop-color="#8C6D23" />
      <stop offset="100%" stop-color="#5A4310" />
    </linearGradient>
    <linearGradient id="pwaNavyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b5c" />
      <stop offset="60%" stop-color="#071630" />
      <stop offset="100%" stop-color="#030b18" />
    </linearGradient>
    <filter id="pwaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#C5A059" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App Squircle Background -->
  <rect width="192" height="192" rx="42" fill="url(#pwaNavyBg)" />
  <rect x="5" y="5" width="182" height="182" rx="38" fill="none" stroke="url(#pwaGoldGrad)" stroke-width="2" opacity="0.8" />

  <!-- Outer Star Mandala -->
  <g filter="url(#pwaGlow)">
    <path d="M96 20 C101 54 130 83 164 88 C130 93 101 122 96 156 C91 122 62 93 28 88 C62 83 91 54 96 20 Z" stroke="url(#pwaGoldGrad)" stroke-width="2.5" fill="#faf8f5" fill-opacity="0.04" />
    <path d="M96 34 C100 60 124 84 150 88 C124 92 100 116 96 142 C92 116 68 92 42 88 C68 84 92 60 96 34 Z" stroke="url(#pwaGoldGrad)" stroke-width="1.2" stroke-dasharray="3 2" fill="none" opacity="0.85" />
    <rect x="64" y="64" width="64" height="64" rx="10" transform="rotate(45 96 96)" fill="url(#pwaNavyBg)" stroke="url(#pwaGoldGrad)" stroke-width="2.5" />
    <circle cx="96" cy="38" r="3" fill="url(#pwaGoldGrad)" />
    <circle cx="96" cy="154" r="3" fill="url(#pwaGoldGrad)" />
    <circle cx="38" cy="96" r="3" fill="url(#pwaGoldGrad)" />
    <circle cx="154" cy="96" r="3" fill="url(#pwaGoldGrad)" />
    
    <!-- P6S Monogram -->
    <text x="96" y="103" font-family="'Cinzel', Georgia, serif" font-size="28" font-weight="900" fill="url(#pwaGoldGrad)" text-anchor="middle" letter-spacing="2">P6S</text>
    <text x="96" y="115" font-family="Arial, sans-serif" font-size="8" font-weight="800" fill="#E5C07B" text-anchor="middle" letter-spacing="3">ATELIER</text>
  </g>
